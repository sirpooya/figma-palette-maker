<meta charset="utf-8" />
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--figma-color-bg, #fff);
    --bg-secondary: var(--figma-color-bg-secondary, #f5f5f5);
    --border: var(--figma-color-border, #e6e6e6);
    --text: var(--figma-color-text, #1a1a1a);
    --text-secondary: var(--figma-color-text-secondary, #7a7a7a);
    --brand: var(--figma-color-bg-brand, #0d99ff);
    --brand-text: var(--figma-color-text-onbrand, #fff);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px;
    font: 11px/1.4 Inter, -apple-system, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  h2 {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }
  .card {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 10px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .row:last-child { margin-bottom: 0; }
  .row > label {
    flex: 0 0 68px;
    color: var(--text-secondary);
  }
  input[type="number"], input[type="text"], select {
    flex: 1;
    min-width: 0;
    height: 24px;
    padding: 0 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
  }
  input[type="range"] { flex: 1; min-width: 0; accent-color: var(--brand); }
  .value {
    flex: 0 0 46px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--text-secondary);
  }
  .ramp {
    display: flex;
    gap: 2px;
    height: 52px;
    margin-bottom: 8px;
  }
  .ramp > div {
    flex: 1;
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.08);
    cursor: pointer;
  }
  .meta {
    display: flex;
    justify-content: space-between;
    font-variant-numeric: tabular-nums;
    color: var(--text-secondary);
    min-height: 15px;
  }
  button {
    height: 28px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: var(--bg-secondary); }
  button.primary {
    background: var(--brand);
    border-color: var(--brand);
    color: var(--brand-text);
  }
  button.primary:hover { filter: brightness(1.08); }
  .actions { display: flex; gap: 6px; }
  .actions > button { flex: 1; }
  .params {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 8px;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--border);
  }
  .params .row { margin: 0; }
  .params .row > label { flex: 0 0 14px; }
  .params .value { flex: 0 0 40px; }
  textarea {
    width: 100%;
    height: 96px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg-secondary);
    color: var(--text);
    font: 10px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 6px;
  }
  #status {
    min-height: 14px;
    margin-top: 6px;
    color: var(--text-secondary);
  }
  #status[data-error="true"] { color: var(--figma-color-text-danger, #f24822); }
</style>
<div id="app"></div>
<script>/*__APP_JS__*/</script>
