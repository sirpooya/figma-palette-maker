<meta charset="utf-8" />
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--figma-color-bg, #fff);
    --bg-secondary: var(--figma-color-bg-secondary, #f5f5f5);
    --bg-hover: var(--figma-color-bg-hover, #f0f0f0);
    --border: var(--figma-color-border, #e6e6e6);
    --text: var(--figma-color-text, #1a1a1a);
    --text-secondary: var(--figma-color-text-secondary, #7a7a7a);
    --brand: var(--figma-color-bg-brand, #0d99ff);
    --brand-text: var(--figma-color-text-onbrand, #fff);
    --danger: var(--figma-color-text-danger, #f24822);
    --pad: clamp(8px, 2.5vw, 14px);
    --label: clamp(52px, 16vw, 72px);
  }
  * { box-sizing: border-box; min-width: 0; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font: 11px/1.4 Inter, -apple-system, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* Preview, tabs and footer are pinned; only the middle region scrolls. */
  #preview { flex: 0 0 auto; padding: var(--pad) var(--pad) 0; }
  #tabs { flex: 0 0 auto; display: flex; gap: 2px; padding: 10px var(--pad) 0; }
  #panels {
    flex: 1 1 auto;
    overflow-y: auto;
    scrollbar-gutter: stable;
    padding: 10px var(--pad) var(--pad);
  }
  #footer {
    flex: 0 0 auto;
    padding: 10px var(--pad);
    border-top: 1px solid var(--border);
    background: var(--bg);
  }

  h2 {
    margin: 0 0 8px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }
  .card {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
  }
  .card + .card { margin-top: 8px; }

  /* Label / control / readout. Only the control is allowed to shrink. */
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 24px;
  }
  .row + .row { margin-top: 6px; }
  .row > label {
    flex: 0 0 var(--label);
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row > .control { flex: 1 1 auto; display: flex; align-items: center; gap: 8px; }

  input[type="number"], input[type="text"], select {
    flex: 1 1 auto;
    width: 100%;
    height: 24px;
    padding: 0 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
  }
  input[type="range"] {
    flex: 1 1 0;
    width: 100%;
    min-width: 0;
    margin: 0;
    accent-color: var(--brand);
  }
  .value {
    flex: 0 0 auto;
    min-width: 40px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--text-secondary);
  }

  /* Preview. Height tracks the window so a tall panel gets a taller ramp. */
  .ramp {
    display: flex;
    gap: 2px;
    height: clamp(44px, 11vh, 110px);
  }
  .ramp > div {
    flex: 1 1 0;
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.1);
    cursor: pointer;
    transition: transform 80ms ease;
  }
  .ramp > div:hover { transform: scaleY(1.06); }
  .meta {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 6px;
    min-height: 15px;
    font-variant-numeric: tabular-nums;
    color: var(--text-secondary);
  }
  .meta span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .tab {
    flex: 1 1 0;
    height: 26px;
    padding: 0 4px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--bg);
    color: var(--text-secondary);
    font: inherit;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tab:hover { background: var(--bg-hover); }
  .tab[aria-selected="true"] {
    background: var(--bg-secondary);
    border-color: var(--text-secondary);
    color: var(--text);
  }

  .equation {
    margin: 0 0 8px;
    padding: 4px 6px;
    border-radius: 4px;
    background: var(--bg-secondary);
    color: var(--text-secondary);
    font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow-x: auto;
    white-space: nowrap;
  }

  /*
   * Curve params. auto-fit with a min(100%, 240px) floor means one column when the
   * window is narrow and two or more when there is genuinely room, and the min()
   * guard is what stops a range input's intrinsic width from overflowing.
   */
  .params {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
    gap: 6px 12px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
  }
  .params .row { margin: 0; }
  .params .row > label {
    flex: 0 0 auto;
    min-width: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-style: italic;
    color: var(--text);
  }
  .params .linkrow { grid-column: 1 / -1; }

  button {
    height: 28px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  button:hover { background: var(--bg-hover); }
  button.primary {
    background: var(--brand);
    border-color: var(--brand);
    color: var(--brand-text);
  }
  button.primary:hover { filter: brightness(1.08); }
  .actions { display: flex; gap: 6px; }
  .actions > button { flex: 1 1 0; }
  .linkrow { display: flex; gap: 6px; margin-top: 8px; }
  .linkrow > button {
    flex: 1 1 0;
    height: 24px;
    padding: 0 8px;
    font-weight: 400;
    color: var(--text-secondary);
  }

  textarea {
    width: 100%;
    height: clamp(80px, 22vh, 300px);
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg-secondary);
    color: var(--text);
    font: 10px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 6px;
  }
  #status {
    min-height: 14px;
    margin-top: 8px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #status[data-error="true"] { color: var(--danger); }

  /*
   * Resize affordances. Figma exposes no native window resizing, so the edges of
   * the iframe drive figma.ui.resize() instead. Deliberately invisible: a cursor
   * change only, no grip glyph anywhere.
   */
  .grab {
    position: fixed;
    z-index: 10;
    background: transparent;
    touch-action: none;
  }
  #grab-x { top: 0; right: 0; width: 5px; height: 100%; cursor: ew-resize; }
  #grab-y { bottom: 0; left: 0; width: 100%; height: 5px; cursor: ns-resize; }
  #grab-xy { bottom: 0; right: 0; width: 14px; height: 14px; cursor: nwse-resize; }
  body[data-resizing="true"] { user-select: none; }
  body[data-resizing="true"] .ramp > div { transition: none; }

  /* Very narrow: stack the label above its control so nothing gets squeezed out. */
  @media (max-width: 320px) {
    .row { flex-wrap: wrap; }
    .row > label { flex: 1 1 100%; }
    .row > .control { flex: 1 1 100%; }
    .tab { font-size: 10px; padding: 0 2px; }
  }

  /* Roomy: the action pair and the naming fields can share rows. */
  @media (min-width: 560px) {
    .card { padding: 12px; }
    #footer .actions > button { flex: 0 1 auto; min-width: 150px; }
  }
</style>
<div id="preview"></div>
<div id="tabs"></div>
<div id="panels"></div>
<div id="footer"></div>
<div class="grab" id="grab-x"></div>
<div class="grab" id="grab-y"></div>
<div class="grab" id="grab-xy"></div>
<script>/*__APP_JS__*/</script>
